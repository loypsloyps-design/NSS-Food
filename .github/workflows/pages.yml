name: Publicar demonstracao NSS Food
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build -- --base=./
      - name: Verify compiled output
        run: |
          test -f dist/index.html
          if grep -Eq 'src=["\x27][^"\x27]*src/main\.tsx' dist/index.html; then exit 1; fi
          test -n "$(find dist/assets -name '*.js' -print -quit)"
      - name: Create dedicated panel entry pages
        run: |
          mkdir -p dist/restaurante dist/admin
          for area in restaurante admin; do
            sed 's|"./assets/|"../assets/|g' dist/index.html > "dist/$area/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
